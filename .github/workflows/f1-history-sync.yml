name: F1 history — load Jolpica dump

# Щотижня підтягує свіжий безкоштовний дамп Jolpica (затримка 14 днів) у схему f1.
# Потрібен секрет репозиторію DATABASE_URL (Supabase → Connect → Session pooler).
on:
  schedule:
    - cron: "30 4 * * 2"   # вівторок 04:30 UTC — після гоночних вихідних
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]==3.2.*"
      - name: Load dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/jolpica/load_dump.py --download --skip-if-loaded
