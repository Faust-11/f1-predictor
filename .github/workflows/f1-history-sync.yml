name: F1 history — dump + fresh races

# 1) свіжий безкоштовний дамп Jolpica (затримка ~14 днів) у схему f1;
# 2) догрузка гонок, що завершились після дампу, з API Jolpica.
# Потрібен секрет репозиторію DATABASE_URL (Supabase → Connect → Session pooler).
on:
  schedule:
    - cron: "0 6 * * 1"    # понеділок 06:00 UTC — після гоночних вихідних
    - cron: "0 6 * * 4"    # четвер — на випадок пізніх змін результатів
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]==3.2.*"
      - name: Load dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/jolpica/load_dump.py --download --skip-if-loaded
      - name: Top up races finished after the dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/jolpica/topup_api.py
